name: Windows installer build

# Packages the litehtml + SourceView variant (no WebKit, no Vte/vim) as a
# Windows installer via PyInstaller + Inno Setup. Neither the installer nor
# formiko.exe is code-signed, so SmartScreen will flag it as untrusted
# until that's set up - "More info -> Run anyway" to run it the first time.

on:
  workflow_dispatch:
  # workflow_dispatch only works once this file exists on the default
  # branch; until this is merged, push to this dev branch to trigger a run.
  push:
    branches: [fallback-render]

permissions:
  contents: read

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest
    continue-on-error: true  # experimental - don't block on this yet

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gtk4
            mingw-w64-x86_64-libadwaita
            mingw-w64-x86_64-gtksourceview5
            mingw-w64-x86_64-python
            mingw-w64-x86_64-python-gobject
            mingw-w64-x86_64-python-pip
            mingw-w64-x86_64-python-setuptools
            mingw-w64-x86_64-gobject-introspection
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-python-pillow
            mingw-w64-x86_64-gsettings-desktop-schemas
            mingw-w64-x86_64-libspelling
            mingw-w64-x86_64-hunspell-en
            mingw-w64-x86_64-adwaita-icon-theme
            mingw-w64-x86_64-hicolor-icon-theme
            git

      - name: Install Python dependencies
        shell: msys2 {0}
        run: |
          pip install \
            mistune Pygments m2r2 docutils-tinyhtmlwriter \
            pyinstaller pyinstaller-hooks-contrib
          # litehtmlpy's CMake build must link against the mingw import
          # library the interpreter actually uses (its own Python
          # detection otherwise falls back to the standard CPython name,
          # which doesn't exist on MSYS2 and silently links a second,
          # uninitialized copy of the runtime). It also needs its Cairo
          # container class explicitly enabled outside Linux.
          py_dot=$(python -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')")
          export CMAKE_ARGS="-DPython_LIBRARY=$MINGW_PREFIX/lib/libpython${py_dot}.dll.a -DLITEHTMLPY_INCLUDE_CAIRO_CONTAINERS=ON"
          pip install -e '.[litehtml]'

      # litehtmlpy's compiled extension ships under the standard CPython
      # Windows platform tag, which MSYS2's Python doesn't recognize.
      # Rename it to the bare ".pyd" fallback every build recognizes.
      - name: Fix litehtmlpy extension filename
        shell: msys2 {0}
        run: |
          litehtmlpy_dir=$(python -c "import litehtmlpy, os; print(os.path.dirname(litehtmlpy.__file__))")
          mv "$litehtmlpy_dir"/litehtmlpy.*.pyd "$litehtmlpy_dir"/litehtmlpy.pyd

      - name: Build .ico from the SVG icon
        shell: msys2 {0}
        run: |
          python -c "
          from PIL import Image
          Image.open('icons/512x512/formiko.png').save(
              'formiko.ico',
              sizes=[(16, 16), (24, 24), (32, 32), (48, 48), (64, 64), (128, 128), (256, 256)],
          )
          "

      - name: Build installer wizard images
        shell: msys2 {0}
        run: python packaging/windows/make_wizard_images.py

      - name: Generate version info and installer metadata
        shell: msys2 {0}
        run: python packaging/windows/generate_metadata.py

      # GTK4's native DLLs and GI typelibs live in the MSYS2 prefix, outside
      # any pip package, so stage them for PyInstaller separately. Also
      # stage fontconfig's config (MSYS2's Pango uses the fontconfig/
      # FreeType backend, not native DirectWrite, so it needs fonts.conf
      # to find any fonts at all), the compiled GSettings schemas
      # (libadwaita/GTK look up org.gnome.desktop.interface internally
      # even on Windows, and an unknown schema is a fatal GLib error), and
      # a share/ dir with GtkSourceView's RelaxNG schemas (its .lang files
      # load fine from its GResource bundle, but the schemas used to
      # validate them are real files) and the icon themes (toolbar/menu
      # icons come from GTK's icon theme lookup, not any resource bundle)
      # - none of these has a "look next to the exe" fallback, so all get
      # pointed at via env vars in formiko/__main__.py instead. The app's
      # own icon (About dialog) and the few symbolic toolbar icons the
      # MSYS2 Adwaita theme lacks are added to the hicolor fallback theme.
      # The MSYS2 packages' licence texts are staged for the installer, and
      # formiko/data (About dialog authors, JSON folding assets) is added
      # to the bundle since PyInstaller only collects Python modules.
      #
      # Enchant (spell checking) has no environment variable for its
      # provider modules: it finds them relative to libenchant's own DLL,
      # and only if that sits in a directory named "bin" with lib/enchant-2
      # next to it (MSYS2's own layout - verified: in a flat directory it
      # reports "no providers found"). Hence PyInstaller's --contents-
      # directory bin, and copying the enchant prefix tree beside it. Its
      # "winspell" provider is the Windows spell checker API, so the
      # dictionaries are the languages installed in Windows itself; hunspell
      # with en_US/en_GB is only a fallback for English. Upstream's winspell
      # fails on every thread but the one that loaded it (libspelling checks
      # words on worker threads, so every word came out misspelled), hence
      # the patched provider built below.
      - name: Stage runtime files
        shell: msys2 {0}
        run: |
          mkdir -p dist-runtime/dlls dist-runtime/share
          cp "$MINGW_PREFIX"/bin/*.dll dist-runtime/dlls/
          cp -r "$MINGW_PREFIX"/lib/girepository-1.0 dist-runtime/gi_typelibs
          cp -r "$MINGW_PREFIX"/etc/fonts dist-runtime/fontconfig
          glib-compile-schemas "$MINGW_PREFIX/share/glib-2.0/schemas"
          cp -r "$MINGW_PREFIX"/share/glib-2.0/schemas dist-runtime/glib-schemas
          cp -r "$MINGW_PREFIX"/share/gtksourceview-5 dist-runtime/share/gtksourceview-5
          cp -r "$MINGW_PREFIX"/share/icons dist-runtime/share/icons
          hicolor=dist-runtime/share/icons/hicolor
          mkdir -p "$hicolor"/scalable/apps "$hicolor"/scalable/actions
          cp icons/formiko.svg "$hicolor"/scalable/apps/
          cp icons/symbolic/*.svg "$hicolor"/scalable/actions/
          rm -f "$hicolor"/icon-theme.cache
          cp -r "$MINGW_PREFIX"/share/licenses dist-runtime/licenses
          # Spell checking (libspelling -> Enchant): laid out like an
          # install prefix, copied next to the PyInstaller output below.
          enchant=dist-runtime/enchant
          mkdir -p "$enchant"/lib/enchant-2 "$enchant"/share/enchant-2 dist-runtime/share/hunspell
          cp "$MINGW_PREFIX"/lib/enchant-2/enchant_hunspell.dll "$enchant"/lib/enchant-2/
          # hunspell looks for dictionaries in XDG_DATA_DIRS/hunspell only
          cp "$MINGW_PREFIX"/share/hunspell/en_US.* "$MINGW_PREFIX"/share/hunspell/en_GB.* dist-runtime/share/hunspell/
          echo '*:winspell,hunspell' > "$enchant"/share/enchant-2/enchant.ordering
          # winspell: our thread-safe build of Enchant's provider, see
          # packaging/windows/enchant_winspell.cpp. MSYS2 ships no
          # enchant-provider.h, so take it from the matching Enchant source.
          build=$(mktemp -d)
          ver=$(pacman -Q mingw-w64-x86_64-enchant | cut -d' ' -f2 | cut -d- -f1)
          curl -fsSL "https://raw.githubusercontent.com/rrthomas/enchant/v$ver/lib/enchant-provider.h" -o "$build"/enchant-provider.h
          : > "$build"/config.h
          g++ -shared -O2 -std=c++17 -I"$build" $(pkg-config --cflags glib-2.0) \
            -D_WIN32_WINNT=0x0602 -DNTDDI_VERSION=0x06020000 -D_ENCHANT_BUILD=1 \
            -o "$enchant"/lib/enchant-2/enchant_winspell.dll packaging/windows/enchant_winspell.cpp \
            -L"$MINGW_PREFIX"/lib -lenchant-2 $(pkg-config --libs glib-2.0) \
            -lole32 -loleaut32 -luuid

      - name: Build with PyInstaller
        shell: msys2 {0}
        run: |
          # --add-data takes a single "src;dest" argument; MSYS2's
          # automatic POSIX->Windows path mangling corrupts that.
          export MSYS2_ARG_CONV_EXCL="*"
          pyinstaller --noconfirm --windowed --name formiko \
            --collect-all gi \
            --collect-all gtksourceview5 \
            --collect-all litehtmlpy \
            --collect-all docutils \
            --collect-all docutils_tinyhtml \
            --collect-submodules mistune \
            --copy-metadata Pygments \
            --copy-metadata mistune \
            --copy-metadata jsonpath-ng \
            --add-data "dist-runtime/dlls;." \
            --add-data "dist-runtime/gi_typelibs;gi_typelibs" \
            --add-data "dist-runtime/fontconfig;fontconfig" \
            --add-data "dist-runtime/glib-schemas;glib-schemas" \
            --add-data "dist-runtime/share;share" \
            --add-data "formiko/data;formiko/data" \
            --version-file version_info.txt \
            --contents-directory bin \
            --icon formiko.ico \
            formiko/__main__.py
          cp -r dist-runtime/enchant/. dist/formiko/

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer with Inno Setup
        shell: pwsh
        run: iscc packaging\windows\formiko.iss

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: formiko-windows-installer
          path: dist/installer/*.exe
          if-no-files-found: warn
