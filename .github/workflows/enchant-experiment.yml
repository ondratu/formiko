name: Enchant relocation experiment (temporary)

on:
  push:
    branches: [fallback-render]
    paths: [".github/workflows/enchant-experiment.yml"]

jobs:
  experiment:
    runs-on: windows-latest
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-libspelling
            mingw-w64-x86_64-hunspell-en

      - name: Layouts
        shell: msys2 {0}
        run: |
          BIN="$MINGW_PREFIX/bin"
          echo "--- enchant files in the MSYS2 prefix"
          ls "$BIN" | grep -i enchant || true
          ls "$MINGW_PREFIX"/lib/enchant-2 || true
          ls "$MINGW_PREFIX"/share/enchant-2 2>/dev/null || true
          ls "$MINGW_PREFIX"/share/hunspell 2>/dev/null | head || true

          mkdir -p /tmp/exp && cd /tmp/exp

          # flat: exe + every DLL in one directory (like the PyInstaller
          # bundle), modules under lib/enchant-2 next to it
          mkdir -p flat/lib/enchant-2 flat/share
          cp "$BIN"/*.dll flat/
          cp "$BIN"/enchant-lsmod-2.exe flat/
          cp "$MINGW_PREFIX"/lib/enchant-2/*.dll flat/lib/enchant-2/
          cp -r "$MINGW_PREFIX"/share/hunspell flat/share/hunspell

          # std: the real MSYS2 shape (DLLs in a directory called bin)
          mkdir -p std/bin std/lib/enchant-2 std/share
          cp "$BIN"/*.dll std/bin/
          cp "$BIN"/enchant-lsmod-2.exe std/bin/
          cp "$MINGW_PREFIX"/lib/enchant-2/*.dll std/lib/enchant-2/
          cp -r "$MINGW_PREFIX"/share/hunspell std/share/hunspell

          # run each with a PATH that has no MSYS2 mingw64/bin, so nothing
          # can be found by accident
          export PATH="/c/Windows/System32:/c/Windows:/usr/bin"
          for layout in flat std; do
            exe=$layout/enchant-lsmod-2.exe
            [ "$layout" = std ] && exe=std/bin/enchant-lsmod-2.exe
            echo "=== $layout: -list-dicts"
            "$exe" -list-dicts 2>&1 | head -20 || true
            echo "=== $layout: -list-providers"
            "$exe" -list-providers 2>&1 | head -20 || true
          done
          echo "=== flat + G_MESSAGES_DEBUG=all"
          G_MESSAGES_DEBUG=all flat/enchant-lsmod-2.exe -list-dicts 2>&1 | head -30 || true
