name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  pytest:
    name: Run pytest${{ matrix.litehtml && ' with litehtmlpy' || '' }}
    runs-on: ubuntu-latest
    strategy:
      # litehtmlpy is not on PyPI and is built from source, so a failing
      # build must not hide the results of the plain run.
      fail-fast: false
      matrix:
        litehtml: [false, true]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            python3-docutils \
            python3-editorconfig \
            python3-gi \
            python3-jsonpath-ng \
            python3-pip \
            python3-pytest \
            python3-venv \
            gir1.2-adw-1 \
            gir1.2-gtksource-5 \
            gir1.2-spelling-1 \
            gir1.2-webkit-6.0
      - name: Install build dependencies of litehtmlpy
        if: matrix.litehtml
        run: |
          sudo apt-get install --no-install-recommends --yes \
            build-essential \
            cmake \
            git \
            libcairo2-dev \
            libpango1.0-dev \
            ninja-build \
            pybind11-dev \
            python3-cairo \
            python3-dev
      - name: Install optional Python dependencies
        run: |
          python3 -m venv --system-site-packages "$RUNNER_TEMP/venv"
          # Not `.[extra]`: it lists docutils-htmlwriter, which is not on PyPI.
          "$RUNNER_TEMP/venv/bin/pip" install \
            pynvim m2r2 mistune Pygments docutils-tinyhtmlwriter
      - name: Build litehtmlpy
        if: matrix.litehtml
        # The same source as the `litehtml` extra in pyproject.toml, without
        # installing formiko itself: the tests must import the checkout.
        run: |
          "$RUNNER_TEMP/venv/bin/pip" install \
            'litehtmlpy @ git+https://github.com/m32/litehtmlpy.git'
      - name: Run tests
        run: |
          env -u DISPLAY -u WAYLAND_DISPLAY \
            "$RUNNER_TEMP/venv/bin/python" -m pytest -m "not gtk_integration" -q -rs
  gtk-integration:
    name: Run GTK integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            dbus \
            mutter \
            python3-docutils \
            python3-editorconfig \
            python3-gi \
            python3-jsonpath-ng \
            python3-pytest \
            gir1.2-adw-1 \
            gir1.2-gtksource-5 \
            gir1.2-spelling-1 \
            gir1.2-webkit-6.0
      - name: Run GTK integration tests in headless Mutter
        run: |
          runtime_dir="$RUNNER_TEMP/mutter-runtime"
          mkdir -m 700 "$runtime_dir"
          env -u DISPLAY -u WAYLAND_DISPLAY \
            XDG_RUNTIME_DIR="$runtime_dir" \
            dbus-run-session -- \
            mutter --wayland --no-x11 --sm-disable --headless -- \
            python3 -m pytest -m gtk_integration -q
