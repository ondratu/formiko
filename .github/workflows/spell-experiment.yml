name: Spell experiment (temporary)

on:
  push:
    branches: [fallback-render]
    paths: [".github/workflows/spell-experiment.yml", "packaging/windows/enchant_winspell.cpp"]

jobs:
  experiment:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-python
            mingw-w64-x86_64-python-gobject
            mingw-w64-x86_64-libspelling
            mingw-w64-x86_64-hunspell-en
            mingw-w64-x86_64-toolchain

      - name: Build patched winspell provider
        shell: msys2 {0}
        run: |
          ver=$(pacman -Q mingw-w64-x86_64-enchant | cut -d" " -f2 | cut -d- -f1)
          echo "enchant $ver"
          mkdir -p /tmp/build
          curl -fsSL "https://raw.githubusercontent.com/rrthomas/enchant/v$ver/lib/enchant-provider.h" -o /tmp/build/enchant-provider.h
          src="$PWD/packaging/windows/enchant_winspell.cpp"
          mkdir -p /tmp/build && cd /tmp/build && : > config.h
          g++ -shared -O2 -std=c++17 -I/tmp/build -I"$MINGW_PREFIX/include/enchant-2" \
            $(pkg-config --cflags glib-2.0) \
            -D_WIN32_WINNT=0x0602 -DNTDDI_VERSION=0x06020000 -D_ENCHANT_BUILD=1 \
            -o enchant_winspell.dll "$src" \
            -L"$MINGW_PREFIX/lib" -lenchant-2 $(pkg-config --libs glib-2.0) \
            -lole32 -loleaut32 -luuid
          ls -la enchant_winspell.dll
          cp enchant_winspell.dll "$MINGW_PREFIX"/lib/enchant-2/enchant_winspell.dll

      - name: Probe
        shell: msys2 {0}
        run: |
          dir=/tmp/enchant-winspell
          mkdir -p $dir
          echo "*:winspell" > $dir/enchant.ordering
          ENCHANT_CONFIG_DIR=$(cygpath -w $dir) python packaging/windows/spell_experiment.py en_LR 2>&1 || true
